name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: python tools/build_docs.py
      - run: python tools/check_presentation_asset.py _build/html
      - run: python tools/check_site.py _build/html
      - run: python tools/check_api_docs.py
      - run: python tools/check_tutorial_assets.py
      - run: python -m pip install -r docs/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-browser-qa
          path: _build/qa
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: _build/html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _build/html
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
