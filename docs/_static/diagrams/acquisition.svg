<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 0 455 460" role="img" aria-labelledby="title description">
  <title id="title">Two-shot acquisition on a 32 by 32 physical grid</title>
  <desc id="description">Axis 0 is x, increasing right; axis 1 is z, increasing downward. Grid indices run from 0 to 31. Shot 0 has one source at x 10, z 10. Shot 1 has one source at x 22, z 10. Each shot has seven receivers at z 6, with x indices 4, 8, 12, 16, 20, 24 and 28. Source symbols are overlaid for comparison, not simultaneous sources in one shot. No PML offset is included.</desc>
  <defs>
    <pattern id="grid" x="140" y="52" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 H 0 V 10" fill="none" stroke="#d9e3ed" stroke-width="0.55"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#40566c"/>
    </marker>
  </defs>
  <rect width="600" height="460" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#23374d">
    <text x="295" y="26" font-size="18" text-anchor="middle">axis 0 · x →</text>
    <text x="67" y="207" font-size="18" text-anchor="middle" transform="rotate(-90 67 207)">axis 1 · z</text>
    <rect x="140" y="52" width="310" height="310" fill="#f7fafc"/>
    <rect x="140" y="52" width="310" height="310" fill="url(#grid)" stroke="#b5c8d9"/>
    <path d="M 140 52 H 467 M 140 52 V 379" fill="none" stroke="#40566c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g font-size="15" text-anchor="middle" fill="#52677b">
      <text x="140" y="398">0</text><text x="180" y="398">4</text>
      <text x="220" y="398">8</text><text x="260" y="398">12</text>
      <text x="300" y="398">16</text><text x="340" y="398">20</text>
      <text x="380" y="398">24</text><text x="420" y="398">28</text>
      <text x="450" y="398">31</text>
    </g>
    <g font-size="15" text-anchor="end" fill="#52677b">
      <text x="125" y="57">0</text><text x="125" y="117">6</text>
      <text x="125" y="157">10</text><text x="125" y="217">16</text>
      <text x="125" y="297">24</text><text x="125" y="367">31</text>
    </g>
    <path d="M 180 112 H 420" fill="none" stroke="#2873a3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <g fill="#fff" stroke="#2873a3" stroke-width="2.5">
      <circle cx="180" cy="112" r="5"/><circle cx="220" cy="112" r="5"/>
      <circle cx="260" cy="112" r="5"/><circle cx="300" cy="112" r="5"/>
      <circle cx="340" cy="112" r="5"/><circle cx="380" cy="112" r="5"/>
      <circle cx="420" cy="112" r="5"/>
    </g>
    <text x="295" y="92" font-size="16" text-anchor="middle" fill="#1c668f">7 receivers · z = 6</text>
    <path d="M 240 143 L 249 152 L 240 161 L 231 152 Z" fill="#b45524" stroke="#fff" stroke-width="1.5"/>
    <path d="M 360 143 L 369 152 L 360 161 L 351 152 Z" fill="#7652a3" stroke="#fff" stroke-width="1.5"/>
    <g font-size="16" text-anchor="middle">
      <text x="232" y="184" fill="#914219">shot 0</text>
      <text x="232" y="205" fill="#914219">(10, 10)</text>
      <text x="368" y="184" fill="#64418e">shot 1</text>
      <text x="368" y="205" fill="#64418e">(22, 10)</text>
    </g>
    <text x="295" y="318" font-size="17" text-anchor="middle" fill="#52677b">32 × 32 physical grid</text>
    <text x="300" y="436" font-size="18" text-anchor="middle">2 independent shots · 1 source per shot</text>
  </g>
</svg>
