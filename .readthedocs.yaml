version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      html:
        - python tools/build_docs.py --output "$READTHEDOCS_OUTPUT/html"
        - python tools/check_site.py "$READTHEDOCS_OUTPUT/html"
        - python tools/check_api_docs.py
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
python:
  install:
    - requirements: docs/requirements.txt
